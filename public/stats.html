<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Stats</title>
	<link rel="icon" href"./favicon.ico" type="image/x-icon">
	<style>
	    body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #333; }
		.card { background : #ff4d4d; padding: 20px; border-radius: 8px; display: inline-block; color: white;}
	</style>
</head>
<body>
    <div class="card">
        <h1>Live server metrics</h1>
        <p>Total fulfilled requests: <strong>{{total}}</strong></p>
        <p>Current active Connections: <strong>{{active}}</strong></p>
        <p>Occured 404 Errors: <strong>{{not_found}}</strong></p>

        <a href="/">Back to homepage</a>
    </div>
</body>
</html>
